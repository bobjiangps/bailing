# nginx site for bailing on its own (sub)domain, e.g. music.example.com.
# Tested layout: Ubuntu 20.04, nginx 1.18 (apt), certificates from certbot.
#
#   sudo cp bailing.conf /etc/nginx/sites-available/bailing.conf
#   sudo ln -s /etc/nginx/sites-available/bailing.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d music.example.com      # fills in the ssl_* lines
#
# config.yaml must match:  server.listen = "127.0.0.1:8080",
#   server.base_url = "https://music.example.com", server.base_path = "".

upstream bailing_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    # certbot's HTTP-01 challenge must stay reachable on port 80
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;            # nginx 1.18 syntax (newer: "http2 on;")
    listen [::]:443 ssl http2;
    server_name music.example.com;

    # --- filled in by certbot -------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bailing.access.log;
    error_log  /var/log/nginx/bailing.error.log warn;

    # Small bodies everywhere; /api/ allows more for LX script uploads.
    client_max_body_size 2m;

    # Compress text only. Images / audio are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css image/svg+xml
               application/manifest+json text/plain;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --- media: stream straight through ---------------------------------------
    # proxy_buffering off is important for two reasons:
    #  1. bailing meters outbound bytes (billed traffic). With buffering on,
    #     nginx would read far ahead of the listener, so bytes that were never
    #     delivered (skip / seek / close) would still be counted and transferred
    #     between the processes.
    #  2. Range requests (seeking) start instantly.
    location /media/ {
        proxy_pass http://bailing_backend;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # P2: relayed online streams (mixed content / CORS fallback)
    location /proxy/ {
        proxy_pass http://bailing_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 6h;      # radio streams are endless
        gzip off;
    }

    location /api/ {
        proxy_pass http://bailing_backend;
        proxy_read_timeout 60s;
        client_max_body_size 12m;   # LX source script upload (Settings)
    }

    # front end (hashed assets get "immutable" cache headers from bailing)
    location / {
        proxy_pass http://bailing_backend;
    }
}

