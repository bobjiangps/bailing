# Snippet: serve bailing under a sub path of an EXISTING site,
# e.g. https://www.example.com/bailing/ next to your other web services.
#
# 1. config.yaml:  server.base_path = "/bailing"
#                  server.base_url  = "https://www.example.com"
# 2. Build the front end with the same prefix:
#       macOS / Linux:  BASE_PATH=/bailing make build-linux
#       Windows (PowerShell):  $env:BASE_PATH="/bailing"; npm --prefix web run build
# 3. Copy this file to /etc/nginx/snippets/bailing.conf and add
#       include snippets/bailing.conf;
#    inside the existing "server { listen 443 ssl ... }" block.
# 4. Make sure an "upstream bailing_backend" exists in the http context, e.g.
#    put the following 4 lines into /etc/nginx/conf.d/bailing-upstream.conf
#    (port = server.listen in config.yaml):
#       upstream bailing_backend {
#           server 127.0.0.1:8080;
#           keepalive 16;
#       }
#
# NOTE: proxy_pass has NO trailing URI on purpose: the /bailing prefix is
# forwarded unchanged and bailing strips it itself (base_path).
#
# "^~" matters on a shared site: without it, regex locations of the other
# apps (e.g. "location ~ \.php$", "location ~ /memory") are checked first and
# can steal /bailing/... requests. The media/proxy regex is nested inside, so
# it is only evaluated for /bailing/ URLs.

location = /bailing { return 301 /bailing/; }
location ^~ /bailing/ {
    proxy_pass http://bailing_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    client_max_body_size 12m;   # LX source script upload (Settings)
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css image/svg+xml;
    # media + relayed streams: unbuffered (accurate traffic metering, fast
    # seeking, endless radio streams). proxy_set_header is inherited.
    location ~ ^/bailing/(media|proxy)/ {
        proxy_pass http://bailing_backend;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 1h;
        gzip off;
    }
}
