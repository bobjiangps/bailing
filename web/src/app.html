<!doctype html>
<html lang="zh-CN" data-mode="light" data-palette="morandi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#EFEBE6" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<title>百灵 · Bailing</title>
		<script>
			// Apply theme before first paint (avoids a flash of the default palette).
			(function () {
				try {
					var p = JSON.parse(localStorage.getItem('bl.prefs') || '{}');
					var dark = p.mode === 'dark' || (p.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					var pal = p.palette && p.palette !== 'auto' ? p.palette : dark ? 'night' : 'morandi';
					var h = document.documentElement;
					h.dataset.mode = dark ? 'dark' : 'light';
					h.dataset.palette = pal;
					if (p.lang === 'en') h.lang = 'en';
				} catch (e) {}
			})();
			// Fresh traffic page id on every page load: the server sums all bytes
			// it sends to requests carrying this cookie (music, photos, app files…),
			// so the "this page" total restarts at zero after a reload / reopen.
			(function () {
				try {
					var a = new Uint8Array(16), s = '', c = 'abcdefghijklmnopqrstuvwxyz0123456789';
					crypto.getRandomValues(a);
					for (var i = 0; i < a.length; i++) s += c[a[i] % 36];
					window.__BL_PAGE__ = s;
					document.cookie = 'bl_pg=' + s + '; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
